# Every third-party component the Go Kvit Notes packages ship, and the
# first-party parts a distributor needs to know the origin of.
# packaging/THIRD-PARTY-NOTICES.md is generated from this file by
# packaging/sbom.py (`packaging/sbom.py notices`); edit this file, not that one.
#
# The packaging scripts also use this file to check each build:
# - every Go module compiled into the executable (as `go version -m` lists
#   it) must have an entry here with `go_module` and the same `version`;
# - every file embedded into the executable with //go:embed must match an
#   `embedded` pattern ("<import path>:<file pattern>");
# - `license_texts` are copied into each artifact's licenses folder (the `to`
#   path is inside it). `from` is a path in this repository, or starts with
#   {module:<module path>} for a file of a Go module in the module cache. A
#   component with `go_module` and no `license_texts` has every LICENSE*,
#   LICENCE*, COPYING*, NOTICE* and PATENTS* file at the top of its module
#   copied into go/<module path>/.
# - `with_math: true` marks components that are part of the math library;
#   their texts are shipped only in artifacts that contain it.
#
# `ships_in` names the artifacts: windows (installer and zip), macos (app
# and disk image), linux (tar.gz, AppImage, AUR package, Flatpak), appimage
# (the AppImage only), source (this repository).
version: 1
components:

  # ── First-party parts ───────────────────────────────────────────────────

  - name: Kvit UI (kvit-ui)
    go_module: github.com/kvit-s/kvit-ui
    version: local replacement (../kvit-ui)
    spdx: MPL-2.0
    origin: https://github.com/kvit-s/kvit-ui (the Kvit component library, the
      same project as Kvit Notes)
    files: compiled into the kvit-notes executable
    license_file: the module's LICENSE, shipped as
      go/github.com/kvit-s/kvit-ui/LICENSE
    ships_in: [windows, macos, linux]
    obligations: None beyond MPL-2.0.

  - name: Application icon and artwork
    version: first-party, 2026-07
    spdx: MPL-2.0
    origin: drawn for this project (packaging/icons/kvit.svg is the source;
      PNG, ICO and ICNS are generated by packaging/icons/generate.sh)
    files: packaging/icons, compiled into the Windows executable as its icon,
      and installed as kvit.icns (macOS) and the hicolor icons (Linux); the
      small PNG sizes in cmd/kvit-notes/icons are embedded in the executable
      for the tray icon
    embedded:
      - "github.com/kvit-s/kvit-notes/cmd/kvit-notes:icons/kvit-notes-*.png"
    license_file: LICENSE (project licence)
    ships_in: [windows, macos, linux, source]
    obligations: None beyond MPL-2.0.

  # ── Go toolchain and modules compiled into the executable ───────────────

  - name: Go standard library and runtime
    go_toolchain: true
    version: go1.27.1
    spdx: BSD-3-Clause
    origin: https://go.dev (the toolchain named by the toolchain line of go.mod)
    files: compiled into the kvit-notes executable
    license_file: the toolchain's LICENSE and PATENTS, shipped as go/std/
    license_texts:
      - {from: "{goroot}/LICENSE", to: go/std/LICENSE}
      - {from: "{goroot}/PATENTS", to: go/std/PATENTS}
    ships_in: [windows, macos, linux]
    obligations: Reproduce the copyright notice, conditions and disclaimer in
      binary distributions.

  - name: unison
    go_module: github.com/richardwilkes/unison
    version: v0.108.0
    spdx: MPL-2.0
    origin: https://github.com/richardwilkes/unison
    files: compiled into the kvit-notes executable, with its embedded SVG
      images (resources/images); its embedded fonts are listed separately
      below
    embedded:
      - "github.com/richardwilkes/unison:resources/images/*.svg"
    license_file: the module's LICENSE, shipped as
      go/github.com/richardwilkes/unison/LICENSE
    ships_in: [windows, macos, linux]
    obligations: MPL-2.0 section 3.2 - tell recipients where the source code
      is (the module at this version, from its origin or from
      https://proxy.golang.org) and ship the licence. unison is used
      unmodified.

  - name: canvas
    go_module: github.com/richardwilkes/canvas
    version: v0.3.1
    spdx: MPL-2.0
    origin: https://github.com/richardwilkes/canvas (its README describes it as
      a pure-Go reimplementation of Skia's rendering subsystems)
    files: compiled into the kvit-notes executable
    license_file: the module's LICENSE, shipped as
      go/github.com/richardwilkes/canvas/LICENSE
    ships_in: [windows, macos, linux]
    obligations: As for unison (MPL-2.0 section 3.2).

  - name: toolbox
    go_module: github.com/richardwilkes/toolbox/v2
    version: v2.20.0
    spdx: MPL-2.0
    origin: https://github.com/richardwilkes/toolbox
    files: compiled into the kvit-notes executable
    license_file: the module's LICENSE, shipped as
      go/github.com/richardwilkes/toolbox/v2/LICENSE
    ships_in: [windows, macos, linux]
    obligations: As for unison (MPL-2.0 section 3.2).

  - name: purego
    go_module: github.com/ebitengine/purego
    version: v0.11.0
    spdx: Apache-2.0
    origin: https://github.com/ebitengine/purego
    files: compiled into the kvit-notes executable (it loads libX11, libGL,
      the macOS frameworks and the math library without cgo)
    license_file: the module's LICENSE, shipped as
      go/github.com/ebitengine/purego/LICENSE
    ships_in: [windows, macos, linux]
    obligations: Ship the Apache-2.0 licence text. The module has no NOTICE
      file.

  - name: fsnotify
    go_module: github.com/fsnotify/fsnotify
    version: v1.10.1
    spdx: BSD-3-Clause
    origin: https://github.com/fsnotify/fsnotify
    files: compiled into the kvit-notes executable
    license_file: the module's LICENSE, shipped as
      go/github.com/fsnotify/fsnotify/LICENSE
    ships_in: [windows, macos, linux]
    obligations: Reproduce the copyright notice in binary distributions.

  - name: dbus
    go_module: github.com/godbus/dbus/v5
    version: v5.2.2
    spdx: BSD-2-Clause
    origin: https://github.com/godbus/dbus
    files: compiled into the Linux executable (kvit-ui's tray icon talks to
      the desktop over D-Bus)
    license_file: the module's LICENSE, shipped as
      go/github.com/godbus/dbus/v5/LICENSE
    ships_in: [linux]
    obligations: Reproduce the copyright notice in binary distributions.

  - name: go-text typesetting (Kvit's patched copy)
    go_module: github.com/go-text/typesetting
    version: local replacement (../kvit-ui/third_party/typesetting)
    spdx: Unlicense OR BSD-3-Clause
    origin: https://github.com/go-text/typesetting v0.3.5, with Kvit's patch
      kvit-ui-go/third_party/typesetting-fontscan-face-loader.patch
    files: compiled into the kvit-notes executable
    license_file: the module's LICENSE, shipped as
      go/github.com/go-text/typesetting/LICENSE
    ships_in: [windows, macos, linux]
    obligations: None under the Unlicense; the BSD-3-Clause notice is shipped
      as well.

  - name: cpuid
    go_module: github.com/klauspost/cpuid/v2
    version: v2.4.0
    spdx: MIT
    origin: https://github.com/klauspost/cpuid
    files: compiled into the amd64 executables (Windows, Linux, the Intel half
      of the macOS executable)
    license_file: the module's LICENSE, shipped as
      go/github.com/klauspost/cpuid/v2/LICENSE
    ships_in: [windows, macos, linux]
    obligations: Keep the copyright and permission notice.

  - name: nativewebp
    go_module: github.com/HugoSmits86/nativewebp
    version: v1.3.0
    spdx: MIT
    origin: https://github.com/HugoSmits86/nativewebp
    files: compiled into the kvit-notes executable
    license_file: the module's LICENSE, shipped as
      go/github.com/HugoSmits86/nativewebp/LICENSE
    ships_in: [windows, macos, linux]
    obligations: Keep the copyright and permission notice.

  - name: goldmark
    go_module: github.com/yuin/goldmark
    version: v1.8.6
    spdx: MIT
    origin: https://github.com/yuin/goldmark
    files: compiled into the kvit-notes executable
    license_file: the module's LICENSE, shipped as
      go/github.com/yuin/goldmark/LICENSE
    ships_in: [windows, macos, linux]
    obligations: Keep the copyright and permission notice.

  - name: xxh3
    go_module: github.com/zeebo/xxh3
    version: v1.1.0
    spdx: BSD-2-Clause
    origin: https://github.com/zeebo/xxh3
    files: compiled into the kvit-notes executable
    license_file: the module's LICENSE, shipped as
      go/github.com/zeebo/xxh3/LICENSE
    ships_in: [windows, macos, linux]
    obligations: Reproduce the copyright notice in binary distributions.

  - name: Go image packages
    go_module: golang.org/x/image
    version: v0.46.0
    spdx: BSD-3-Clause
    origin: https://go.googlesource.com/image
    files: compiled into the kvit-notes executable
    license_file: the module's LICENSE and PATENTS, shipped in
      go/golang.org/x/image/
    ships_in: [windows, macos, linux]
    obligations: Reproduce the copyright notice in binary distributions.

  - name: Go networking packages
    go_module: golang.org/x/net
    version: v0.59.0
    spdx: BSD-3-Clause
    origin: https://go.googlesource.com/net
    files: compiled into the kvit-notes executable
    license_file: the module's LICENSE and PATENTS, shipped in
      go/golang.org/x/net/
    ships_in: [windows, macos, linux]
    obligations: Reproduce the copyright notice in binary distributions.

  - name: Go system call packages
    go_module: golang.org/x/sys
    version: v0.48.0
    spdx: BSD-3-Clause
    origin: https://go.googlesource.com/sys
    files: compiled into the kvit-notes executable
    license_file: the module's LICENSE and PATENTS, shipped in
      go/golang.org/x/sys/
    ships_in: [windows, macos, linux]
    obligations: Reproduce the copyright notice in binary distributions.

  - name: Go text packages
    go_module: golang.org/x/text
    version: v0.42.0
    spdx: BSD-3-Clause
    origin: https://go.googlesource.com/text
    files: compiled into the kvit-notes executable
    license_file: the module's LICENSE and PATENTS, shipped in
      go/golang.org/x/text/
    ships_in: [windows, macos, linux]
    obligations: Reproduce the copyright notice in binary distributions.

  # ── Fonts embedded in the executable ────────────────────────────────────

  - name: Roboto font (embedded by unison)
    version: "2.137"
    spdx: Apache-2.0
    origin: Google, through unison's resources/fonts
    files: the Roboto TTF files embedded in the kvit-notes executable
    embedded:
      - "github.com/richardwilkes/unison:resources/fonts/Roboto*"
    license_file: unison's "Roboto License.txt", shipped as
      fonts/Roboto-LICENSE.txt
    license_texts:
      - {from: "{module:github.com/richardwilkes/unison}/resources/fonts/Roboto License.txt",
         to: fonts/Roboto-LICENSE.txt}
    ships_in: [windows, macos, linux]
    obligations: Ship the Apache-2.0 licence text.

  - name: DejaVu Sans Mono font (embedded by unison)
    version: "2.37"
    spdx: Bitstream-Vera AND LicenseRef-Arev-Fonts
    origin: https://dejavu-fonts.github.io, through unison's resources/fonts
      (DejaVu's own changes are in the public domain)
    files: the DejaVu Sans Mono TTF files embedded in the kvit-notes executable
    embedded:
      - "github.com/richardwilkes/unison:resources/fonts/DejaVu Sans Mono*"
    license_file: unison's "DejaVu Sans Mono License.txt", shipped as
      fonts/DejaVu-Sans-Mono-LICENSE.txt
    license_texts:
      - {from: "{module:github.com/richardwilkes/unison}/resources/fonts/DejaVu Sans Mono License.txt",
         to: fonts/DejaVu-Sans-Mono-LICENSE.txt}
    ships_in: [windows, macos, linux]
    obligations: Keep the Bitstream and Arev copyright notices with the
      fonts; the fonts may not be sold on their own.

  - name: Phosphor icon font (embedded by kvit-ui)
    version: "2.1"
    spdx: MIT
    origin: https://phosphoricons.com, through kvit-ui's icons/Phosphor.ttf
    files: Phosphor.ttf, embedded in the kvit-notes executable
    embedded:
      - "github.com/kvit-s/kvit-ui/icons:Phosphor.ttf"
    license_file: kvit-ui's icons/Phosphor-LICENSE.txt, shipped as
      fonts/Phosphor-LICENSE.txt
    license_texts:
      - {from: "{module:github.com/kvit-s/kvit-ui}/icons/Phosphor-LICENSE.txt",
         to: fonts/Phosphor-LICENSE.txt}
    ships_in: [windows, macos, linux]
    obligations: Keep the copyright and permission notice.

  # ── The math library (kvitmath) and its resources ───────────────────────

  - name: MicroTeX (cLaTeXMath)
    with_math: true
    version: pinned commit 0e3707f6, with three local memory fixes found by
      AddressSanitizer (src/latex.cpp released an asprintf buffer with
      delete instead of free; src/utils/indexed_arr.h searched one row past
      the end of every indexed table; src/atom/atom_matrix.cpp assigned an
      Environment from a copy the assignment itself destroyed) and one local
      addition (src/render.cpp exposes the unrounded layout metrics its
      whole-pixel getters truncate, which is what lets a formula be aligned
      to a text baseline)
    spdx: MIT
    origin: https://github.com/NanoMichael/cLaTeXMath
    files: third_party/microtex/src, compiled with mathtex/native into the
      math library (kvitmath.dll, libkvitmath.dylib, libkvitmath.so);
      third_party/microtex/res, shipped as math-res (excluding the font
      sub-licences listed separately below)
    license_file: third_party/microtex/LICENSE.clatexmath, shipped as
      LICENSE.microtex
    license_texts:
      - {from: third_party/microtex/LICENSE.clatexmath, to: LICENSE.microtex}
    ships_in: [windows, macos, linux, source]
    obligations: Preserve the copyright notice and licence text.

  - name: tinyxml2
    with_math: true
    version: vendored with cLaTeXMath
    spdx: Zlib
    origin: https://github.com/leethomason/tinyxml2
    files: third_party/microtex/tinyxml2, compiled into the math library
    license_file: third_party/microtex/tinyxml2/LICENSE.txt, shipped as
      LICENSE.tinyxml2
    license_texts:
      - {from: third_party/microtex/tinyxml2/LICENSE.txt, to: LICENSE.tinyxml2}
    ships_in: [windows, macos, linux, source]
    obligations: Keep the notice; altered sources must be marked.

  - name: LLVM libc++, libc++abi and libunwind (in the math library)
    with_math: true
    version: as shipped with zig 0.16.0
    spdx: Apache-2.0 WITH LLVM-exception
    origin: https://llvm.org, through zig (https://ziglang.org), which links
      them statically into the math library (tools/build-mathlib.sh)
    files: compiled into kvitmath.dll, libkvitmath.dylib and libkvitmath.so
    license_file: packaging/licenses/zig-runtimes/LICENSE.libcxx,
      LICENSE.libcxxabi and LICENSE.libunwind, copied from zig 0.16.0's
      lib/ directory and shipped in math-runtime/
    license_texts:
      - {from: packaging/licenses/zig-runtimes/LICENSE.libcxx, to: math-runtime/LICENSE.libcxx}
      - {from: packaging/licenses/zig-runtimes/LICENSE.libcxxabi, to: math-runtime/LICENSE.libcxxabi}
      - {from: packaging/licenses/zig-runtimes/LICENSE.libunwind, to: math-runtime/LICENSE.libunwind}
    ships_in: [windows, macos, linux]
    obligations: The LLVM exception removes the notice requirement for code
      compiled into a program; the texts are shipped anyway. Update the copies
      when the zig version in tools/build-mathlib.sh changes.

  - name: Zig compiler runtime (in the math library)
    with_math: true
    version: zig 0.16.0
    spdx: MIT
    origin: https://ziglang.org (compiler_rt, linked into every library zig
      builds)
    files: compiled into kvitmath.dll, libkvitmath.dylib and libkvitmath.so
    license_file: packaging/licenses/zig-runtimes/LICENSE.zig, shipped as
      math-runtime/LICENSE.zig
    license_texts:
      - {from: packaging/licenses/zig-runtimes/LICENSE.zig, to: math-runtime/LICENSE.zig}
    ships_in: [windows, macos, linux]
    obligations: Keep the copyright and permission notice.

  - name: mingw-w64 runtime (in the Windows math library)
    with_math: true
    version: as shipped with zig 0.16.0
    spdx: ZPL-2.1 AND LicenseRef-Public-Domain
    origin: https://www.mingw-w64.org, through zig, which links its start-up
      code into kvitmath.dll (the C library itself is Windows' own UCRT)
    files: compiled into kvitmath.dll
    license_file: packaging/licenses/zig-runtimes/COPYING.mingw-w64, copied
      from zig 0.16.0's lib/libc/mingw/COPYING and shipped as
      math-runtime/COPYING.mingw-w64
    license_texts:
      - {from: packaging/licenses/zig-runtimes/COPYING.mingw-w64, to: math-runtime/COPYING.mingw-w64}
    ships_in: [windows]
    obligations: Reproduce the copyright notice, conditions and disclaimer in
      binary distributions.

  - name: TeX math fonts vendored by cLaTeXMath (base, euler, latin, maths)
    with_math: true
    version: vendored with cLaTeXMath
    spdx: Knuth-CTAN AND OFL-1.1 AND LicenseRef-dsrom
    origin: CTAN via cLaTeXMath
    files: math-res/fonts/{base,euler,latin,maths}
    license_file: math-res/fonts/licences/ (Knuth_License.txt, OFL.txt,
      License_for_dsrom.txt), beside the fonts
    ships_in: [windows, macos, linux, source]
    obligations: Ship the licence files beside the fonts (the math-res tree
      has them); OFL forbids selling the fonts on their own.

  - name: kvit-newtx math fonts (NewTX / XCharter derivatives)
    with_math: true
    version: generated 2026-07 from CTAN newtx + xcharter by Michael Sharpe
    spdx: LPPL-1.3c AND LicenseRef-Bitstream-Charter AND OFL-1.1
    origin: https://ctan.org/pkg/newtx, https://ctan.org/pkg/xcharter;
      generated by tools/generate_newtx_microtex.py in the Qt repository
      (tag qt-final after the switch)
    files: math-res/fonts/kvit-newtx
    license_file: math-res/fonts/kvit-newtx/LICENSES and NOTICE.md, beside
      the fonts
    ships_in: [windows, macos, linux, source]
    obligations: LPPL renaming requirement satisfied by the kvit_newtx_*
      names; keep NOTICE.md and LICENSES with the fonts; the Bitstream
      Charter notice must stay intact. The generated fonts also include STIX
      script and blackboard-bold glyphs (stxscr, txmiaSTbb, txbmiaSTbb, in
      kvit_newtx_ntxmia and kvit_newtx_ntxbmia) under OFL-1.1, so
      LICENSES/OFL-1.1.txt must ship with them, the STI Pub Companies
      copyright must stay intact, and the fonts must not be sold on their
      own. The OFL reserved name "STIX" is not used by the generated fonts,
      which is what permits the kvit_newtx_* renaming.

  - name: Greek alphabet fonts for MicroTeX
    with_math: true
    version: vendored with cLaTeXMath
    spdx: GPL-3.0-only
    origin: CTAN (Greek TeX fonts) via cLaTeXMath
    files: math-res/greek
    license_file: math-res/greek/LICENSE, beside the fonts
    ships_in: [windows, macos, linux, source]
    obligations: >-
      Ship the GPL-3 text with the fonts. Owner ruling 2026-07-19 (made for
      the Qt app, which ships the same files): shipped as aggregation - plain
      GPL-3, no font-embedding exception, accepted because the fonts are
      standalone data files, the app rasterizes math in-process, and no font
      is ever embedded into exported documents. Serves literal
      Cyrillic/polytonic-Greek characters inside formulas; TeX math Greek
      commands come from the math fonts and never touch this pack.

  - name: Cyrillic alphabet fonts for MicroTeX
    with_math: true
    version: vendored with cLaTeXMath
    spdx: GPL-3.0-only
    origin: CTAN (Washington Cyrillic) via cLaTeXMath
    files: math-res/cyrillic
    license_file: math-res/cyrillic/LICENSE, beside the fonts
    ships_in: [windows, macos, linux, source]
    obligations: >-
      Ship the GPL-3 text with the fonts. Same 2026-07-19 owner ruling and
      aggregation reasoning as the Greek pack above.

  # ── Packaging runtime ───────────────────────────────────────────────────

  - name: AppImage type-2 runtime
    version: commit 75849dce7cc37e4319b633df1f116ca895c71a12
    spdx: MIT AND LGPL-2.1-only AND BSD-2-Clause AND BSD-3-Clause AND Zlib
    origin: https://github.com/AppImage/type2-runtime
    files: the static-pie executable header prepended to the Linux AppImage;
      includes musl libc, libfuse, squashfuse, libzstd and zlib
    license_file: packaging/licenses/appimage-runtime holds the upstream
      notice and the LGPL-2.1 text; the AppImage has both in
      usr/share/licenses/kvit-notes/appimage-runtime
    license_texts:
      - {from: packaging/licenses/appimage-runtime/LICENSE, to: appimage-runtime/LICENSE.appimage-runtime}
      - {from: packaging/licenses/appimage-runtime/LICENSE.LGPL2.1, to: appimage-runtime/LICENSE.LGPL2.1}
    ships_in: [appimage]
    obligations: >-
      Preserve the upstream runtime notice and the embedded libraries'
      attribution. Ship the LGPL-2.1 terms for the statically linked libfuse.
      The exact corresponding runtime source is the origin repository at this
      commit; keep the runtime URL, digest, source commit and this entry
      synchronized when updating it (packaging/linux/build-linux.sh).

  # ── Referenced, not shipped ─────────────────────────────────────────────

  - name: Mermaid grammar definitions (reference only)
    version: mermaid@11.16.0
    spdx: MIT
    origin: https://github.com/mermaid-js/mermaid
    files: none shipped - the diagram parsers in the mermaid package are
      first-party Go written against the pinned jison grammar definitions; no
      Mermaid code or assets are vendored
    license_file: not applicable (acknowledgment entry)
    ships_in: []
    obligations: None; the entry records where the parsers' grammar comes from.

  - name: MathJax (external CDN reference)
    version: pinned URL in HTML export
    spdx: Apache-2.0
    origin: https://www.mathjax.org
    files: none shipped - HTML export writes a script tag loading MathJax
      from its CDN in the reader's browser; nothing is bundled or executed
      in-process
    license_file: not applicable (external service reference)
    ships_in: []
    obligations: None for distribution; noted for network-disclosure review.
